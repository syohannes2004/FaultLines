name: Diag
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== catalog"; curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $T" | head -c 600; echo
          echo "== chat"; curl -sS -i -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi"}]}' | head -c 900; echo
          echo "== azure"; curl -sS -i -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}' | head -c 900; echo
          echo "== dns"; getent hosts models.github.ai; echo "proxy: $HTTPS_PROXY $https_proxy"
          echo "== gdelt"; curl -sS -o /dev/null -w "%{http_code} %{time_total}s\n" "https://api.gdeltproject.org/api/v2/doc/doc?query=%22Sudan%22&mode=timelinevolraw&timespan=8d&format=json"
